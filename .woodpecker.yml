when:
  - path: [ "*/src/**" , "Cargo.toml", ".woodpecker.yml" ]
    event: push

steps:
  reuse:
    image: fsfe/reuse:latest

  rustfmt:
    image: rust
    commands:
      - rustup toolchain install nightly && rustup component add --toolchain nightly rustfmt
      - cargo +nightly fmt -- --check

  clippy:
    image: rust
    commands:
      - rustup component add clippy
      - apt update -y -qq && apt install -y -qq --no-install-recommends clang pkg-config libpcsclite-dev libdbus-1-dev
      - cargo clippy --no-deps

  unit-tests:
    image: rust
    commands:
      - apt update -y -qq && apt install -y -qq --no-install-recommends clang pkg-config libpcsclite-dev libdbus-1-dev
      - cargo test --all

  test-opcard-virtual:
    image: registry.gitlab.com/openpgp-card/virtual-cards/opcard-rs-tools
    pull: true
    environment:
      RUST_LOG: debug
    commands:
      - apt update -y -qq && DEBIAN_FRONTEND=noninteractive apt install -y -qq dropbear expect libdbus-1-dev
      # Start pcscd, virtual OpenPGP card
      - sh /start.sh
      # Start dropbear ssh server (openssh-server seems hard to run in a container)
      - /etc/init.d/dropbear start
      # Set up user account to ssh into
      - useradd testuser && mkdir -p /home/testuser/.ssh
      # Card-state configuration to set PIN backend to "direct" (we don't have secret-service in CI)
      - mkdir -p /root/.config/openpgp-card-state
      - cp tests/config.opcard  /root/.config/openpgp-card-state/config.toml

      # Run/configure SSH Agent
      # (build without the default "notify" feature: its dependencies require a newer Rust version than this image has.)
      - cargo build --no-default-features
      - cargo run --no-default-features -- -H unix://$XDG_RUNTIME_DIR/ocsa.sock &
      - export SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/ocsa.sock
      - sleep 10

      - echo 'Test ssh logins with different key types'
      - /bin/bash -c 'tests/gen-login.sh 0000:00000000 cv25519'
      - /bin/bash -c 'tests/gen-login.sh 0000:00000000 rsa2048'
      - /bin/bash -c 'tests/gen-login.sh 0000:00000000 rsa3072'
      - /bin/bash -c 'tests/gen-login.sh 0000:00000000 rsa4096'
      - /bin/bash -c 'tests/gen-login.sh 0000:00000000 nistp256'

  test-smartpgp-virtual:
    image: registry.gitlab.com/openpgp-card/virtual-cards/smartpgp-tools
    pull: true
    environment:
      RUST_LOG: debug
      RUST_BACKTRACE: 1
    commands:
      - . "$HOME/.cargo/env"
      - apt update -y -qq && DEBIAN_FRONTEND=noninteractive apt install -y -qq dropbear expect openssh-client libdbus-1-dev
      # Start pcscd, virtual OpenPGP card
      - sh /start.sh
      # Start dropbear ssh server (openssh-server seems hard to run in a container)
      - /etc/init.d/dropbear start
      # Set up user account to ssh into
      - useradd testuser && mkdir -p /home/testuser/.ssh
      # Card-state configuration to set PIN backend to "direct" (we don't have secret-service in CI)
      - mkdir -p /root/.config/openpgp-card-state
      - cp tests/config.smartpgp /root/.config/openpgp-card-state/config.toml

      # Run/configure SSH Agent
      # (build without the default "notify" feature: its dependencies require a newer Rust version than this image has.)
      - cargo build --no-default-features
      - cargo run --no-default-features -- -H unix://$XDG_RUNTIME_DIR/ocsa.sock &
      - export SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/ocsa.sock
      - sleep 10

      - echo 'Test ssh logins with different key types'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 nistp256'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 nistp384'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 nistp521'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 rsa2048'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 rsa3072'
      - /bin/bash -c 'tests/gen-login.sh AFAF:00001234 rsa4096'
