[package]
name = "openpgp-card-ssh-agent"
description = "A simple ssh-agent backed by OpenPGP card authentication keys"
version = "0.1.4"
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>", "Heiko Schaefer <heiko@schaefer.name>"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://gitlab.com/openpgp-card/ssh-agent"
documentation = "https://docs.rs/openpgp-card-ssh-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.13"
sha2 = "0.10"
openssh-keys = "0.5"

tokio = "1"
tokio-uds = "0.2"
tokio-reactor = "0.1"
env_logger = "0.10"
log = "0.4"
service-binding = "^0.3.0"
clap = { version = "3.1", features = ["derive", "env"] }
notify-rust = { version = "4", optional = true }

ssh-agent-lib = "0.2.5"

sequoia-openpgp = "1.3"

openpgp-card = "0.3"
openpgp-card-pcsc = "0.3"
openpgp-card-sequoia = "0.1"

[profile.release]
codegen-units = 1

[features]
default = ["notify"]
notify = ["notify-rust"]