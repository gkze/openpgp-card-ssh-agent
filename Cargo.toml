[package]
name = "openpgp-card-ssh-agent"
description = "A simple ssh-agent backed by OpenPGP card authentication keys"
version = "0.2.3"
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>", "Heiko Schaefer <heiko@schaefer.name>"]
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://codeberg.org/openpgp-card/ssh-agent/"
documentation = "https://docs.rs/openpgp-card-ssh-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
sha2 = "0.10"
openssh-keys = "0.6"
openpgp-card-state = "0.1"

env_logger = "0.11"
log = "0.4"
clap = { version = "3", features = ["derive", "env"] }

ssh-agent-lib = "0.3.0"
tokio = { version = "1.36.0", features = ["full"] }
service-binding = "^0.3.0"

openpgp-card = "0.4"
card-backend-pcsc = "0.5"

notify-rust = { version = "4", optional = true }

[profile.release]
codegen-units = 1

[features]
default = ["notify"]
notify = ["notify-rust"]
