[package]
name = "ssh-agent-pks"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.13.0"
openssh-keys = "0.5.0"
hyper = { version = "0.14.14", features = ["full"] }
tokio = { version = "1", features = ["full"] }
hyper-tls = "0.5.0"
#listenfd = "0.3.5"
#systemd_socket = { git = "https://github.com/viraptor/systemd_socket" }
env_logger = "0.9.0"
tokio-uds = { version = "0.2.5" }
tokio-reactor = { version = "0.1.1" }

[dependencies.ssh-agent]
version = "0.2.3"
features = ["agent"]
git = "https://github.com/sekey/ssh-agent.rs"
rev = "refs/pull/28/head"
