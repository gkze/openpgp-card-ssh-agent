image: rust

rustfmt:
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt -- --check

clippy:
  before_script:
    - rustup component add clippy
    - apt update -y -qq && apt install -y -qq --no-install-recommends clang pkg-config nettle-dev libpcsclite-dev
  script:
    - cargo clippy --all

